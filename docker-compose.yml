services:
  # ---------------------------------------------------------------------------
  # Local PostgreSQL (used only for local development without Neon)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-snapattend}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Node.js API server
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: snapattend-backend:latest
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-snapattend}
      - JWT_SECRET=${JWT_SECRET}
      - PYTHON_API_BASE_URL=http://ai-service:8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
      - CLASSROOM_PHOTOS_BUCKET=${CLASSROOM_PHOTOS_BUCKET:-classroom-photos}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Upstash Redis URL — set this to your Upstash rediss:// connection string
      - REDIS_URL=${REDIS_URL}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # BullMQ Worker — same image as backend, different entrypoint
  # Consumes jobs from the "attendance" BullMQ queue and calls the AI service.
  # Can be scaled horizontally: `docker-compose up --scale worker=3`
  # ---------------------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: snapattend-backend:latest
    # Override the default CMD to run the worker entry point instead of the API.
    command: ["node", "dist/worker/index.js"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-snapattend}
      - PYTHON_API_BASE_URL=http://ai-service:8000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Upstash Redis URL — same as the backend
      - REDIS_URL=${REDIS_URL}
      # AI service timeouts (worker can afford longer timeouts than the API)
      - AI_RECOGNIZE_TIMEOUT_MS=${AI_RECOGNIZE_TIMEOUT_MS:-90000}
      - AI_REGISTER_TIMEOUT_MS=${AI_REGISTER_TIMEOUT_MS:-30000}
      # Number of jobs the worker processes in parallel (default: 1)
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-1}
      # pgvector cosine distance threshold (0=identical, 2=opposite; default 0.5)
      - PGVECTOR_SIMILARITY_THRESHOLD=${PGVECTOR_SIMILARITY_THRESHOLD:-0.5}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy   # Wait for /ready probe, not just process start
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Next.js frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: snapattend-frontend:latest
    environment:
      - NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL:-http://localhost:5000/api}
      - NEXT_PUBLIC_LOCAL_API_URL=${NEXT_PUBLIC_LOCAL_API_URL:-http://localhost:5000/api}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FastAPI AI service (face detection + recognition)
  # ---------------------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: snapattend-ai-service:latest
    ports:
      - "8000:8000"
    volumes:
      - ai-models:/app/models
    restart: unless-stopped
    healthcheck:
      # Use /ready (Phase 6) — returns 503 until YuNet+SFace models are loaded.
      # This prevents the worker from sending jobs before inference is available.
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s   # Allow time for model download on first run

volumes:
  pgdata:
  ai-models:
